name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          API_URL: ${{ vars.APPS_SCRIPT_URL }}
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png _site/
          if [ -n "$API_URL" ]; then sed -i "s|__API_URL__|${API_URL}|g" _site/index.html; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
